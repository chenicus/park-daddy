<!doctype html>
<html lang="en">
<head>
<script>(function(){var d=document.documentElement;var t;try{t=localStorage.getItem('pd_theme');}catch(e){}if(t!=='dark'&&t!=='light')t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';d.dataset.theme=t;})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Snap a sign — Park Daddy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<!-- Add to Home Screen launches this page full-screen, no Safari chrome, no typing a URL mid-run. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snap">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root[data-theme="light"] { --bg:#fff; --fg:#111; --sub:#666; --card:#f4f4f5; --line:#e4e4e7; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; }
  :root[data-theme="dark"]  { --bg:#0b0b0d; --fg:#f2f2f2; --sub:#9a9aa2; --card:#18181b; --line:#2a2a2e; --accent:#3b82f6; --ok:#22c55e; --err:#f87171; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100%; display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none;   /* no accidental text-select from a running thumb */
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  header a { color: var(--sub); text-decoration: none; font-size: 13px; }
  header h1 { font-size: 22px; font-weight: 700; margin: 0; }
  #count { font-size: 13px; color: var(--sub); }
  #count.has-fail { color: var(--err); }

  main { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; max-width: 480px; margin: 0 auto; width: 100%; }

  #intro { font-size: 13px; color: var(--sub); line-height: 1.45; }

  #gps { font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #gps .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); flex: none; }
  #gps.fix .dot { background: var(--ok); }
  /* A denied-permission fix is a full "go here, tap this" instruction, not a one-line status —
     stacking it as plain text under the intro paragraph read as one undifferentiated wall of
     grey copy. Giving it its own tinted card, a short bold headline instead of a run-on
     sentence, and a real button (not an inline text link) makes it read as ONE distinct thing
     to act on rather than more of the same prose. */
  #gpsErr { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 4px;
    padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--err) 10%, transparent); }
  #gpsErr svg { flex: none; width: 20px; height: 20px; color: var(--err); }
  .err-body { flex: 1 1 180px; min-width: 0; }
  /* 13px, not its own size: weight and full-strength --fg already separate this from the
     --sub steps beneath it, and a 15px step sat 1.15 from 13 and 1.13 from the 17px shutter
     label showing behind this card — three sizes too close to read as a hierarchy. */
  .err-title { font-size: 13px; font-weight: 600; color: var(--fg); }
  .err-steps { font-size: 13px; color: var(--sub); margin-top: 2px; line-height: 1.4; }
  .err-retry { flex: none; border: none; border-radius: 999px; background: var(--accent); color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; cursor: pointer; }

  /* the whole rest of the screen IS the shutter — biggest possible target for a moving thumb */
  .shot-btn {
    position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; border: 2px dashed var(--line); border-radius: 24px; background: var(--card);
    overflow: hidden; cursor: pointer; transition: background .15s;
  }
  .shot-btn:active { background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .shot-btn.waiting { opacity: .45; pointer-events: none; }
  .shot-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .shot-btn input:disabled { pointer-events: none; }
  .shot-btn svg { width: 56px; height: 56px; color: var(--sub); }
  .shot-btn span { color: var(--sub); font-size: 17px; font-weight: 600; text-align: center; padding: 0 24px; }
  .shot-btn .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .shot-btn .flash.go { animation: flash .35s ease-out; }
  @keyframes flash { from { opacity: .9; } to { opacity: 0; } }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s;
    background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px;
    font-size: 13px; pointer-events: none; white-space: nowrap; max-width: 90vw; text-overflow: ellipsis; overflow: hidden;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <a href="./">← Map</a>
  <h1>Snap a sign</h1>
  <span id="count">0 saved</span>
</header>

<main>
  <p id="intro">See a parking sign we're missing or got wrong? Snap it here. We'll read it and fix the map.</p>

  <div id="gps"><span class="dot"></span><span id="gpsText">Finding your location…</span></div>
  <div id="gpsErr" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
    <div class="err-body">
      <div class="err-title">Location access needed</div>
      <div class="err-steps">Settings › Privacy &amp; Security › Location Services › Safari Websites › While Using</div>
    </div>
    <button class="err-retry" id="gpsRetry" type="button">Try again</button>
  </div>

  <label class="shot-btn waiting" id="shotBtn">
    <input id="photo" type="file" accept="image/*" capture="environment" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8a2 2 0 0 1 2-2h1.2l.9-1.5A1.5 1.5 0 0 1 9.4 4h5.2a1.5 1.5 0 0 1 1.3.75L16.8 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span id="shotLabel">Waiting for GPS…</span>
    <div class="flash" id="flash"></div>
  </label>
</main>

<div id="toast"></div>

<script type="module">
import { submitReport, serverRefused, isDuplicateReport } from './reports.js?v=5';

const $ = (id) => document.getElementById(id);
let toastT;
function toast(msg) {
  clearTimeout(toastT);
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  toastT = setTimeout(() => $('toast').classList.remove('show'), 1800);
}

// ---- keep a live position warm the whole session, so a capture never waits on a cold GPS fix
let lastPos = null, watchId = null;

// ---- combining fixes while you stand still --------------------------------------
// A phone's GNSS is good to roughly 5-15 m outdoors and no amount of code changes that for a
// single reading. But standing at a sign, successive fixes are repeated measurements of the
// SAME point, and repeated measurements of one point average down. Walking or driving they're
// measurements of different points and averaging would smear them into the middle of the path,
// so we only combine while the readings themselves say we haven't moved.
// Whether you're moving is decided by coords.speed, not by comparing positions. Speed comes
// from GNSS Doppler and is independent of the position estimate, which matters because position
// can't tell the two apart: walking pace over a 10 s window covers about as much ground as the
// noise on a 10 m fix, so a spread test reads slow walking and a jittery stationary fix
// identically — and averaging while walking lands you behind where you actually are.
const fixes = [];                 // recent readings, oldest first
const FIX_WINDOW_MS = 15000;      // never combine anything older than this
const MAX_FIXES = 12;
const STILL_SPEED = 0.7;          // m/s — below walking pace, so a scanner at a sign counts as still
const STILL_M = 4;                // fallback spread gate, only for receivers that report no speed

// Some receivers report no speed at all (null), and some report -1 rather than null.
const speedKnown = (f) => Number.isFinite(f.spd) && f.spd >= 0;
const moving = (f) => speedKnown(f) && f.spd >= STILL_SPEED;

function metresBetween(a, b) {
  const mPerLat = 111320, mPerLon = 111320 * Math.cos(a.lat * Math.PI / 180);
  return Math.hypot((b.lat - a.lat) * mPerLat, (b.lon - a.lon) * mPerLon);
}

// Largest distance from the group's centroid — how spread out this set of readings is.
function spreadOf(g) {
  const c = { lat: g.reduce((s, f) => s + f.lat, 0) / g.length, lon: g.reduce((s, f) => s + f.lon, 0) / g.length };
  return Math.max(...g.map((f) => metresBetween(c, f)));
}

function currentFix() {
  if (!fixes.length) return null;
  const newest = fixes[fixes.length - 1];
  const solo = { lat: newest.lat, lon: newest.lon, acc: newest.acc, n: 1 };
  if (moving(newest)) return solo;        // moving right now — nothing to average against
  const now = Date.now();

  // Walk backwards from the newest reading, stopping at the first one taken while moving.
  // Walking up to a sign and stopping therefore combines only the readings since you stopped,
  // instead of smearing them back along the way you came; a capture taken from a moving car
  // never combines at all and behaves exactly as it did before.
  const group = [newest];
  for (let i = fixes.length - 2; i >= 0; i--) {
    const f = fixes[i];
    if (now - f.t > FIX_WINDOW_MS || moving(f)) break;
    const cand = group.concat(f);
    // Only fall back to comparing positions when the receiver gave us no speed to trust.
    if (!cand.every(speedKnown) && spreadOf(cand) > STILL_M) break;
    group.push(f);
  }
  if (group.length < 2) return solo;

  // Inverse-variance weighting: weighting each reading by 1/acc² is the maximum-likelihood way
  // to combine estimates of differing confidence, so a tight fix outvotes a loose one.
  let w = 0, la = 0, lo = 0;
  for (const f of group) { const k = 1 / (f.acc * f.acc); w += k; la += f.lat * k; lo += f.lon * k; }

  // 1/sqrt(w) is the formal combined error, but it assumes the readings are independent and they
  // aren't — consecutive fixes share the same multipath and atmospheric error, which averaging
  // cannot remove. So floor the number we report at half the best single reading rather than
  // claim a precision we can't back up.
  const best = Math.min(...group.map((f) => f.acc));
  return { lat: la / w, lon: lo / w, acc: Math.max(1 / Math.sqrt(w), best / 2), n: group.length };
}

// iOS gives no JS/URL way to jump straight to its location settings — Apple pulled the old
// app-settings: scheme years ago — so a denied prompt gets plain-language steps instead of a
// dead "fix it" link, split by error.code since "denied" and "no signal yet" need different advice.
function onGeoError(err) {
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (err.code === err.PERMISSION_DENIED) {
    $('gpsText').textContent = 'Location unavailable';
    $('gpsErr').hidden = false;
  } else if (err.code === err.POSITION_UNAVAILABLE) {
    $('gpsText').textContent = 'No GPS signal — try moving away from buildings or indoors.';
  } else {
    $('gpsText').textContent = 'Still finding your signal…';
  }
}
$('gpsRetry').addEventListener('click', startWatch);

function startWatch() {
  $('gpsErr').hidden = true;
  if (!('geolocation' in navigator)) { $('gpsText').textContent = 'Geolocation not supported on this browser'; return; }
  $('gpsText').textContent = 'Finding your location…';
  watchId = navigator.geolocation.watchPosition(
    (p) => {
      const first = !lastPos;
      // acc floored at 1 m so it can never be 0 and blow up the 1/acc² weighting below.
      fixes.push({
        lat: p.coords.latitude, lon: p.coords.longitude,
        acc: Math.max(1, p.coords.accuracy), spd: p.coords.speed,
        t: p.timestamp || Date.now(),
      });
      while (fixes.length > MAX_FIXES) fixes.shift();
      lastPos = currentFix();
      $('gps').classList.add('fix');
      // Plain units, not "±6m": at this size a lowercase m reads as a magnitude, and the ±
      // dangles off a number (your lat/lon) the screen never shows. Floored at 1 m so a very
      // good fix never reads as the nonsense "accurate to about 0 m".
      $('gpsText').textContent = `Location found — accurate to about ${Math.max(1, Math.round(lastPos.acc))} m`;
      if (first) armShutter();
    },
    onGeoError,
    // maximumAge: 0 — never hand back a cached reading. At 4 s a cached fix was up to ~6 m stale
    // on foot, and staleness is error we control, unlike the receiver's own uncertainty.
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
  );
}
startWatch();

function armShutter() {
  $('shotBtn').classList.remove('waiting');
  $('shotLabel').textContent = 'Tap to shoot the sign';
  $('photo').disabled = false;
}

// ---- counters ------------------------------------------------------------------
let saved = 0, failed = 0;
function renderCount() {
  $('count').textContent = failed ? `${saved} saved, ${failed} failed` : `${saved} saved`;
  $('count').classList.toggle('has-fail', failed > 0);
}

// No on-the-spot categorization — the sign itself carries the real rules (morning/evening,
// permit hours, etc.), so every shot just gets a placeholder; reading and parsing each sign
// into real data happens later, off the run, from the saved photos.
const DEFAULT_DETAIL = 'Field scan — read sign for actual rate/hours';

// ---- capture: fire-and-forget so the shutter is ready again immediately, never blocked on
// the network — you keep running while the previous photo is still uploading in the background.
// Re-opens the camera immediately after, chained off this same trusted 'change' event — browsers
// only allow a file/camera picker to open from a real user gesture, and completing the previous
// capture is one, so this keeps the loop going without a tap in between. The very first shot of
// the run still needs one manual tap (nothing can open the picker before any gesture exists).
function onPhotoChange() {
  const input = $('photo');
  const f = input.files[0];
  if (!f) return;
  // Recombine here rather than reusing the value the last watch callback happened to leave
  // behind: this runs after the camera closes, so a reading may have landed in between, and
  // the stillness test wants the freshest window it can get.
  const pos = currentFix() || lastPos;

  $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
  input.value = '';   // let the very next camera shot re-fire change even if a filename repeats
  input.click();      // straight back into the camera for the next sign

  if (!pos) { toast('No GPS fix yet — try again in a sec'); return; }
  saveWithRetry(f, pos, DEFAULT_DETAIL);
}
$('photo').addEventListener('change', onPhotoChange);

async function saveWithRetry(file, pos, detail, attempt = 1) {
  try {
    await submitReport({
      block: { lat: pos.lat, lon: pos.lon, _label: 'Field scan' },
      reason: 'other',
      detail: detail.slice(0, 200),
      photoFile: file,
      accuracy: pos.acc,   // logged so the "location is rough" threshold comes from real runs, not a guess
      samples: pos.n,      // 1 = a single moving reading, >1 = combined while standing still
    });
    saved++; renderCount();
    toast('Saved — we’ll review it');
  } catch (e) {
    console.warn('[scan] submit failed, attempt', attempt, e);
    // The server already has this shot — either a retry whose first attempt actually landed,
    // or the dedup guard catching a photo-less row. Nothing was lost, so it counts as saved.
    if (isDuplicateReport(e)) { saved++; renderCount(); toast('Already saved — same spot, moments ago'); return; }
    // A refusal is the server's verdict on this exact payload: the next three attempts get the
    // same answer, and calling it a connection problem sends you looking at your signal bars.
    if (serverRefused(e)) {
      failed++; renderCount();
      toast(e.serverMessage ? 'Scan rejected — ' + e.serverMessage : 'Scan rejected by the server');
      return;
    }
    if (attempt < 3) {
      setTimeout(() => saveWithRetry(file, pos, detail, attempt + 1), attempt * 2000);
    } else {
      failed++; renderCount();
      toast('A scan failed to save — check connection');
    }
  }
}
</script>
</body>
</html>
