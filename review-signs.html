<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Park Daddy · Sign review</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18181b;background:#f4f4f5}*{box-sizing:border-box}
body{margin:0;padding:24px;max-width:1000px;margin-inline:auto}h1{font-size:28px;margin:0 0 8px}p{line-height:1.45}
main{display:grid;gap:20px}section{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}
label{display:grid;gap:6px;font-weight:600;margin:12px 0}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid #777;border-radius:8px}textarea{min-height:150px;font-family:ui-monospace,monospace}
button{min-height:44px;padding:10px 16px;border-radius:9px;border:1px solid #18181b;background:#18181b;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.secondary{background:#fff;color:#18181b}.row{display:flex;gap:10px;flex-wrap:wrap}.card{border-top:1px solid #ddd;padding-top:20px;margin-top:20px}.card img{max-width:100%;max-height:420px;border-radius:10px;background:#ddd}.meta{color:#555}.error{color:#ad211b;font-weight:600}.success{color:#176a36;font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:600px){body{padding:14px}.grid{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Sign review</h1><p>Only approved, checked signs become community parking markers. Review the original image, location, street side and every rate window before publishing. Upload a redacted public evidence image.</p></header>
<section id="login"><h2>Moderator sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<section id="queue" hidden><div class="row"><h2 style="flex:1;margin:0">Pending scans</h2><button id="refresh" class="secondary">Refresh</button><button id="logout" class="secondary">Sign out</button></div><p id="status" role="status"></p><div id="items"></div></section>
</main><script type="module" src="./review-signs.js"></script></body></html>
